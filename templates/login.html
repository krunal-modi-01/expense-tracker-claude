{% extends "base.html" %}

{% block title %}Sign in — Spendly{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-subtitle">Sign in to your Spendly account</p>
        </div>

        <div class="auth-card">
            <div id="global-error" class="auth-error" style="display:none;"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email"
                           class="form-input" placeholder="nitish@example.com"
                           autofocus>
                    <div id="error-email" class="auth-error" style="display:none;"></div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           class="form-input" placeholder="Your password">
                    <div id="error-password" class="auth-error" style="display:none;"></div>
                </div>
                <button type="submit" class="btn-submit">Sign in</button>
            </form>
        </div>

        <p class="auth-switch">
            Don't have an account?
            <a href="{{ url_for('register') }}">Create one free</a>
        </p>

    </div>
</section>

{% endblock %}

{% block scripts %}
<script>
    document.getElementById('login-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        clearErrors();

        var email = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value;

        var clientErrors = {};
        if (!email) {
            clientErrors['email'] = 'Email is required';
        } else if (!email.includes('@')) {
            clientErrors['email'] = 'Enter a valid email address';
        }
        if (!password) {
            clientErrors['password'] = 'Password is required';
        }

        if (Object.keys(clientErrors).length > 0) {
            showErrors(clientErrors);
            return;
        }

        try {
            var res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password }),
            });
            var json = await res.json();

            if (res.ok) {
                localStorage.setItem('spendly_token', json.data.token);
                window.location.href = '/';
            } else if (json.errors) {
                showErrors(json.errors);
            } else {
                showGlobalError(json.error || 'Something went wrong. Please try again.');
            }
        } catch {
            showGlobalError('Network error. Please try again.');
        }
    });

    function clearErrors() {
        document.querySelectorAll('.auth-error').forEach(function (el) {
            el.style.display = 'none';
            el.textContent = '';
        });
    }

    function showErrors(errors) {
        Object.keys(errors).forEach(function (field) {
            var el = document.getElementById('error-' + field);
            if (el) {
                el.textContent = errors[field];
                el.style.display = 'block';
            } else {
                showGlobalError(errors[field]);
            }
        });
    }

    function showGlobalError(msg) {
        var el = document.getElementById('global-error');
        el.textContent = msg;
        el.style.display = 'block';
    }
</script>
{% endblock %}
